[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kipimo"
version = "0.4.0"
description = "Swahili agent-task evaluation suite for the East Africa coordination stack — model-agnostic seed benchmark (46 tasks: server routing, term grounding, cascade routing)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AfriKaziOS maintainers"}]
keywords = ["swahili", "benchmark", "evaluation", "mcp", "kenya", "ai-agents"]

[project.urls]
Homepage = "https://github.com/gabrielmahia/kipimo"
Repository = "https://github.com/gabrielmahia/kipimo"
Issues = "https://github.com/gabrielmahia/kipimo/issues"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"

[project.scripts]
kipimo = "kipimo.cli:_main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["kipimo"]

[tool.setuptools.package-data]
kipimo = ["data/*.jsonl"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned ruff in CI; these are documented, intentional patterns rather than debt:
#   BLE001/TRY004 — adapters and feed loops catch broadly ON PURPOSE so one bad
#                   source cannot sink an entire run (see adapters/pipeline).
#   S112          — `continue` on exception is the intended degrade-gracefully path.
#   PLW1510       — test subprocess calls assert on returncode explicitly.
#   C408/SIM103/RUF059/EXE001 — style-only; not worth churning working code.
ignore = ["BLE001", "TRY004", "S112", "PLW1510", "C408", "SIM103", "RUF059", "EXE001", "E501"]
